[workspace]
resolver = "2"
members = ["crates/lintel-diag", "crates/lintel-core", "crates/lintel-cli", "crates/lintel-lsp", "crates/lintel-wasm", "crates/lintel-docs"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.lints.clippy]
# Relaxations of the `pedantic` group used by CI (`clippy -D warnings -W
# clippy::pedantic`; the bare `-W pedantic` name is a renamed-and-removed
# lint that errors under `-D warnings` on current toolchains).
# Each entry carries a rationale; everything else in `pedantic` stays warn-by-default.
cast_possible_truncation = "allow" # line/offset counters go usize -> u32; u32 covers >4G lines per file
module_name_repetitions = "allow"  # ast::Node / scan::Parsed are re-exported at the crate root by design
string_slice = "allow"             # the scanner slices only at ASCII-delimited byte offsets (parser invariant)

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3

# The T-13 playground budget ("loads <1 MB gz"): the wasm bundle is built
# with `cargo build --profile wasm-release --target wasm32-unknown-unknown`
# (see `make playground`), optimized for size instead of speed.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
strip = true
