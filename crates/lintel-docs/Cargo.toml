[package]
name = "lintel-docs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The T-17 docs-site builder: renders the committed markdown pages, the error index and the committed benchmark results into a self-contained static tree, then link-checks every emitted page"
repository = "https://github.com/elcoosp/lintel"
publish = false

[dependencies]
lintel-diag = { path = "../lintel-diag" }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[lints]
workspace = true
