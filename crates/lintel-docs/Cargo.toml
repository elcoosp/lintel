[package]
name = "lintel-docs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The T-17 docs-site builder: renders the committed markdown pages, the error index and the committed benchmark results into a self-contained static tree, then link-checks every emitted page"
repository = "https://github.com/elcoosp/lintel"
publish = false

[dependencies]
# the version rides the release (T-18): crates.io refuses a path dep without one
lintel-diag = { version = "1.0.0", path = "../lintel-diag" }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[lints]
workspace = true
