[package]
name = "lintl-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Scanner, parser and line-preserving emitter for the Lintl JSX-for-PHP compiler"
repository = "https://github.com/elcoosp/lintl"

[dependencies]
# the version rides the release (T-18): crates.io refuses a path dep without one
lintl-diag = { version = "0.1.0", path = "../lintl-diag" }

[dev-dependencies]
criterion = "0.5"
proptest = "1"
serde_json = "1"

[[bench]]
name = "compile"
harness = false

[lints]
workspace = true
