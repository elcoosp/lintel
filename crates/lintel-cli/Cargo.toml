[package]
name = "lintel-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The `lintel` command-line interface: build and check `.lintel.php` sources"
repository = "https://github.com/elcoosp/lintel"

[dependencies]
lintel-core = { path = "../lintel-core" }
# The T-31 manifest reads/updates the project's `lintel.json` as real JSON
# (preserving the user's keys) — hand-rolled splicing would corrupt it.
serde_json = "1"
# The T-12 daemon watches the project for changed `.lintel.php` sources.
notify = "8"

[[bin]]
name = "lintel"
path = "src/main.rs"

[lints]
workspace = true

[dev-dependencies]
lintel-core = { path = "../lintel-core" }
serde_json = "1"
