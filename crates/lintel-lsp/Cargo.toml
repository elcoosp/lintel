[package]
name = "lintel-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The Lintel language-server foundation: diagnostics and hover for .lintel.php files"
repository = "https://github.com/elcoosp/lintel"

[dependencies]
# the version rides the release (T-18): crates.io refuses a path dep without one
lintel-core = { version = "1.0.0", path = "../lintel-core" }
# The T-21 wire types (initialize, publishDiagnostics, hover) come from
# lsp-types; serde_json drives the JSON-RPC framing both sides speak.
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The `.lintel-cache/lsp-index.json` cache is written by every concurrent
# LSP session: the persist is flocked (fs2 wraps flock(2) / LockFileEx
# cross-platform) so two sessions cannot interleave a partial write.
fs2 = "0.4"
# The tree-sitter lane (§17.1 Q3): the upstream PHP grammar parses the
# declaration structure the LSP queries need; its `wasm` feature
# (wasmtime) stays off — the workspace compiles the grammar's C with `cc`.
tree-sitter = { version = "0.25", default-features = false }
tree-sitter-php = "0.25"

[lints]
workspace = true
