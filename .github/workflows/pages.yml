# M3 release-readiness: publish the docs-site + playground to GitHub Pages.
#
# `lintel.sh` is not live at launch, so every diagnostic the product emits
# (the 13 LNT docs URLs) points at the configurable `LINTEL_DOCS_BASE`,
# whose default is this Pages URL. The docs-site builder (make docs-site)
# emits docs-site/build/ with every markdown page rendered, the error
# index at /e/LNTxxxx/ for all 13 codes, and the playground mirrored at
# /playground/. This workflow publishes that tree to Pages on every push
# to main, so the emitted URLs resolve from launch day.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true
      - name: Build the docs-site + error index + playground mirror (link-checked)
        run: make docs-site
      - name: "M3 emitted-URL integrity gate — every URL the product emits resolves"
        # Run the gate against the LOCAL build tree (file://), not the live
        # Pages URL: the build job runs BEFORE the deploy job publishes the
        # site, so on a fresh repo (or the first run after Pages is enabled)
        # the live /e/LNTxxxx/ URLs do not exist yet and would 404 — a
        # chicken-and-egg that reds the build and blocks the deploy that
        # would publish them. The gate's job is to prove every emitted URL
        # HAS a page (the docs-site build emitted it); the deploy job's
        # page_url is the liveness check that the site is actually served.
        run: bash scripts/emitted-url-gate.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
