# T-18 release engineering, the v0.1.0 automation (architecture doc §15,
# §12): a pushed `v*` tag builds the five binaries (§12: linux x64/arm64
# musl, macOS x64/arm64, Windows x64), checksums them (SHA256SUMS), attests
# build provenance (actions/attest-build-provenance — GitHub artifact
# attestation instead of minisign/cosign), extracts the release body from
# the CHANGELOG's `## [0.1.0]` section and stages the DRAFT release for
# the maintainer's review. The publish job then ships the four publishable
# crates to crates.io in dependency order (diag → core → lsp → cli, with
# index-propagation waits and a `--dry-run` pre-flight per crate) and
# triggers the Packagist updates for the composer packages (`lintl/lintl`
# + `markup/markup`), verifying the tag landed before the job goes green.
#
# The ONLY step left to the human: review the draft release and click
# publish (scripts/release-dry-run.sh validates all of this offline, and
# the tag guard below refuses a tag that disagrees with the workspace
# version).

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # actions/attest-build-provenance signs with the workflow OIDC identity

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: lintl
            archive: lintl-linux-x64.tar.gz
            cross: musl-tools
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary: lintl
            archive: lintl-linux-arm64.tar.gz
            cross: cargo-zigbuild
          - name: macos-x64
            # macos-13/macos-14 are retired (GitHub removed the labels).
            # macos-15 is the current arm64 runner; the x86_64-apple-darwin
            # target is cross-compiled on it (the toolchain step installs the
            # target). Use macos-15-intel for a native Intel build.
            os: macos-15
            target: x86_64-apple-darwin
            binary: lintl
            archive: lintl-macos-x64.tar.gz
          - name: macos-arm64
            # macos-14 was retired by GitHub on 2026-11-02 (like macos-13
            # before it); macos-15 is the current arm64 runner.
            os: macos-15
            target: aarch64-apple-darwin
            binary: lintl
            archive: lintl-macos-arm64.tar.gz
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: lintl.exe
            archive: lintl-windows-x64.zip
    steps:
      - uses: actions/checkout@v4
      # The tag guard: a `v*` tag that disagrees with the ONE workspace
      # version ([workspace.package].version — every crate inherits it)
      # refuses before anything builds. `v0.1.0` must mean every crate is
      # 0.1.0; the release-dry-run checks the same equality offline.
      - name: Tag guard — the tag must equal the workspace version
        shell: bash
        run: |
          VERSION=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::could not read [workspace.package].version from Cargo.toml"; exit 1
          fi
          echo "workspace version: $VERSION; tag: $GITHUB_REF_NAME"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version v$VERSION — bump [workspace.package].version (or tag v$VERSION)"; exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install the cross linker toolchain (linux arm64 via zig)
        if: matrix.cross == 'cargo-zigbuild'
        uses: taiki-e/install-action@cargo-zigbuild
      - name: Install musl tools (native linux x64)
        if: matrix.cross == 'musl-tools'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p lintl-cli
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: cargo-zigbuild
      - name: Stage the archive
        shell: bash
        run: |
          mkdir -p dist
          # `case`, not `[[ == ]]`: actionlint substitutes the unknown
          # `${{ matrix.os }}` with an empty string, so shellcheck flags the
          # `if` form as SC2193 (a comparison that can never be equal).
          case "${{ matrix.os }}" in
            windows-*)
              cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/
              7z a "dist/${{ matrix.archive }}" ./dist/${{ matrix.binary }}
              rm dist/${{ matrix.binary }}
              ;;
            *)
              cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.binary }}"
              tar -czf "dist/${{ matrix.archive }}" -C dist "${{ matrix.binary }}"
              rm "dist/${{ matrix.binary }}"
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums (SHA256SUMS, the composer.json extra pin format)
        working-directory: dist
        run: sha256sum lintl-* | tee SHA256SUMS
      - name: Attest build provenance (the release signatures)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/lintl-*
      # The release body is the CHANGELOG's `## [0.1.0]` section — the
      # same text scripts/release-dry-run.sh previews, so what was
      # reviewed offline is exactly what the draft carries.
      - name: Extract the release body from the CHANGELOG
        run: |
          awk '/^## \[0\.1\.0\]/{flag=1; next} /^## /{flag=0} flag' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md carries no '## [0.1.0]' section (or it is empty) — the release body would be empty"; exit 1
          fi
          echo "release body: $(wc -m < release-notes.md) chars from '## [0.1.0]'"
      - name: Stage the DRAFT GitHub release (binaries + SHA256SUMS + the changelog body)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: release-notes.md
          files: |
            dist/lintl-*
            dist/SHA256SUMS

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Guard the publish secrets (loud failure, never a silent skip)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          missing=0
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set — add it under Settings → Secrets → Actions (a crates.io API token with publish scope for lintl-core/-diag/-lsp/-cli)"; missing=1
          fi
          if [ -z "$PACKAGIST_USERNAME" ] || [ -z "$PACKAGIST_TOKEN" ]; then
            echo "::error::PACKAGIST_USERNAME / PACKAGIST_TOKEN are not set — add them under Settings → Secrets → Actions (a Packagist API token; the update-package call needs it)"; missing=1
          fi
          exit $missing
      # The dry-run pre-flight: each crate must PACKAGE standalone (its
      # packaged Cargo.toml + the verification build) before the real
      # upload is attempted.
      - name: cargo publish --dry-run (each publishable crate packages standalone)
        run: |
          for crate in lintl-diag lintl-core lintl-lsp lintl-cli; do
            echo "== dry-run: $crate =="
            cargo publish --dry-run --locked -p "$crate"
          done
      # The crates.io leg, interleaving the dry-run pre-flight with each
      # real publish, in dependency order: lintl-diag first (it is the
      # graph's root — lintl-core depends on IT), then lintl-core
      # (lintl-lsp and lintl-cli depend on core), then lintl-lsp, then
      # lintl-cli. Each dependent's `--dry-run` resolves its dependency's
      # NEW registry version — which only exists after the previous real
      # publish — so the pre-flight must follow the publish, with the wait
      # letting the registry index propagate in between.
      - name: cargo publish (diag → core → lsp → cli, dry-run pre-flight + publish per crate)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish --dry-run --locked -p lintl-diag
          cargo publish --locked --token "$CARGO_REGISTRY_TOKEN" -p lintl-diag
          sleep 20
          cargo publish --dry-run --locked -p lintl-core
          cargo publish --locked --token "$CARGO_REGISTRY_TOKEN" -p lintl-core
          sleep 20
          cargo publish --dry-run --locked -p lintl-lsp
          cargo publish --locked --token "$CARGO_REGISTRY_TOKEN" -p lintl-lsp
          sleep 20
          cargo publish --dry-run --locked -p lintl-cli
          cargo publish --locked --token "$CARGO_REGISTRY_TOKEN" -p lintl-cli
      # The composer leg: Packagist derives package versions from the pushed
      # tag, so the publish action is the update-package API call over the
      # repo — it refreshes BOTH monorepo packages (lintl/lintl +
      # markup/markup), then each is verified to carry the tag's version
      # before the job goes green.
      - name: Publish the composer packages to Packagist (lintl/lintl + markup/markup)
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          echo "triggering the Packagist update for the monorepo packages: lintl/lintl + markup/markup (source: this repository)"
          http=$(curl -sS -o /tmp/packagist-response.json -w '%{http_code}' \
            -X POST \
            -H "Accept: application/json" \
            -u "$PACKAGIST_USERNAME:$PACKAGIST_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"repository": {"url": "https://github.com/elcoosp/lintl"}}' \
            "https://packagist.org/api/update-package")
          cat /tmp/packagist-response.json; echo
          if [ "$http" != "200" ]; then
            echo "::error::the Packagist update-package call failed (HTTP $http)"; exit 1
          fi
          for pkg in lintl/lintl markup/markup; do
            ok=0
            for attempt in 1 2 3 4 5; do
              sleep 10
              if curl -fsSL "https://repo.packagist.org/p2/$pkg.json" | python3 -c "import json, os, sys; d = json.load(sys.stdin); vs = [v['version'] for v in d['packages'][list(d['packages'])[0]]]; sys.exit(0 if os.environ['TAG_VERSION'] in vs else 1)"; then
                echo "$pkg: $TAG_VERSION visible on Packagist"
                ok=1; break
              fi
              echo "$pkg: $TAG_VERSION not visible yet (attempt $attempt)"
            done
            if [ "$ok" != "1" ]; then
              echo "::error::$pkg does not expose $TAG_VERSION on Packagist after the update — check the package's source URL on packagist.org"; exit 1
            fi
          done
      - name: The maintainer's remaining step (review the draft)
        run: |
          echo "Everything automated: five binaries + SHA256SUMS + provenance attestations on the DRAFT release;"
          echo "crates.io carries lintl-core/-diag/-lsp/-cli at ${{ github.ref_name }}; Packagist serves both composer packages at ${{ github.ref_name }}."
          echo "Remaining human step: review https://github.com/elcoosp/lintl/releases and click Publish."
