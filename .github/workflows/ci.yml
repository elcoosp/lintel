name: ci

on:
  push:
  pull_request:

env:
  PUN_VERSION: "0.4.3"
  PUN_REPO: "shipfastlabs/pun"
  PUN_ASSET: "punphp-x86_64-unknown-linux-musl.tar.gz"
  LELA_VERSION: "0.1.0-alpha.1"
  LELA_REPO: "lelaphp/lela"
  LELA_ASSET: "lela-${LELA_VERSION}-linux-x86_64.tar.gz"

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "actionlint (parse-validates every workflow edit pre-handoff)"
        uses: docker://rhysd/actionlint:1.7.12

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (pedantic, warnings as errors)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -W clippy::pedantic
      - name: "cargo-deny (T-01: advisories, licenses, bans, sources)"
        uses: EmbarkStudios/cargo-deny-action@v2
      - name: Tests (all features)
        run: cargo test --workspace --all-features
      - name: Benches (smoke)
        run: cargo test --workspace --benches

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.6'
          coverage: none
          tools: composer
      - uses: dtolnay/rust-toolchain@stable
      - name: "Install Pun (PHP tooling: format, lint, install)"
        run: |
          curl -fsSL "https://github.com/${PUN_REPO}/releases/download/v${PUN_VERSION}/${PUN_ASSET}" | tar -xz -C /usr/local/bin
          pun --version
      - name: Install PHP deps with Pun (replaces composer install)
        run: |
          pun install --working-dir=php/runtime
          pun install --working-dir=php/lintel
          pun install --working-dir=php/lintel-phpstan
          pun install --working-dir=php/markup
          pun install --working-dir=php/blade
          pun install --working-dir=php/twig
          pun install --working-dir=bench
      - name: Build the lintel binary for the PHP gates
        run: cargo build --release -p lintel-cli
      - name: composer validate (every composer.json)
        run: |
          composer validate --working-dir=php/runtime --no-check-all
          composer validate --working-dir=php/lintel --no-check-all
          composer validate --working-dir=php/lintel-phpstan --no-check-all
          composer validate --working-dir=php/markup --no-check-all
          composer validate --working-dir=php/blade --no-check-all
          composer validate --working-dir=php/twig --no-check-all
          composer validate --working-dir=bench --no-check-all
      - name: Pun format + lint (src directories only)
        run: |
          pun format php/runtime/src php/lintel/src php/lintel-phpstan/src php/markup/src php/blade/src php/twig/src
          pun lint php/runtime/src php/lintel/src php/lintel-phpstan/src php/markup/src php/blade/src php/twig/src
      - name: Rust PHP gates (php -l on every golden output + init demo execution)
        run: cargo test --workspace --all-features
        env:
          PHP_BIN: php
      - name: PHPUnit threat corpus (§7.2) + installer/loader suite
        run: bash scripts/php-gates.sh test
        env:
          LINTEL_TEST_BIN: ${{ github.workspace }}/target/release/lintel
      - name: "§10 server adapters — the RoadRunner live lane + the Swoole/FrankenPHP/ReactPHP structural lanes (the deferred adapters gap closes)"
        run: |
          curl -fsSL --retry 2 -o /tmp/rr.tar.gz \
            https://github.com/roadrunner-server/roadrunner/releases/download/v2025.1.15/roadrunner-2025.1.15-linux-amd64.tar.gz
          mkdir -p /tmp/rr-bin && tar -xzf /tmp/rr.tar.gz --strip-components=1 -C /tmp/rr-bin
          echo "/tmp/rr-bin" >> "$GITHUB_PATH"
          php php/runtime/vendor/bin/phpunit --configuration php/runtime/phpunit.xml
        env:
          LINTEL_E2E_RR: '1'
      - name: PHPStan (level max)
        run: bash scripts/php-gates.sh stan

  php-lela:
    name: php (Lela 8.5 — faster PHPUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lela
        run: |
          curl -fsSL "https://github.com/${LELA_REPO}/releases/download/v${LELA_VERSION}/${LELA_ASSET}" | tar -xz -C /usr/local/bin
          lela --version
      - uses: dtolnay/rust-toolchain@stable
      - name: "Install Pun (for deps with --ignore-platform-req=php)"
        run: |
          curl -fsSL "https://github.com/${PUN_REPO}/releases/download/v${PUN_VERSION}/${PUN_ASSET}" | tar -xz -C /usr/local/bin
          pun --version
      - name: Install PHP deps with Pun (ignore platform req since lock requires 8.6)
        run: |
          pun install --working-dir=php/runtime --ignore-platform-req=php
          pun install --working-dir=php/lintel --ignore-platform-req=php
          pun install --working-dir=php/lintel-phpstan --ignore-platform-req=php
          pun install --working-dir=php/markup --ignore-platform-req=php
          pun install --working-dir=php/blade --ignore-platform-req=php
          pun install --working-dir=php/twig --ignore-platform-req=php
          pun install --working-dir=bench --ignore-platform-req=php
      - name: Build the lintel binary
        run: cargo build --release -p lintel-cli
      - name: PHPUnit with Lela (all packages)
        run: |
          LINTEL_TEST_BIN="${{ github.workspace }}/target/release/lintel" \
          lela php/lintel/vendor/bin/phpunit --configuration php/lintel/phpunit.xml
          lela php/runtime/vendor/bin/phpunit --configuration php/runtime/phpunit.xml
          LINTEL_TEST_BIN="${{ github.workspace }}/target/release/lintel" \
          lela php/lintel-phpstan/vendor/bin/phpunit --configuration php/lintel-phpstan/phpunit.xml
          LINTEL_TEST_BIN="${{ github.workspace }}/target/release/lintel" \
          lela php/markup/vendor/bin/phpunit --configuration php/markup/phpunit.xml
          LINTEL_TEST_BIN="${{ github.workspace }}/target/release/lintel" \
          lela php/blade/vendor/bin/phpunit --configuration php/blade/phpunit.xml
          LINTEL_TEST_BIN="${{ github.workspace }}/target/release/lintel" \
          lela php/twig/vendor/bin/phpunit --configuration php/twig/phpunit.xml
        env:
          LINTEL_TEST_BIN: ${{ github.workspace }}/target/release/lintel

  dx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.6'
          coverage: none
          tools: composer
      - uses: dtolnay/rust-toolchain@stable
      - name: "Install Pun"
        run: |
          curl -fsSL "https://github.com/${PUN_REPO}/releases/download/v${PUN_VERSION}/${PUN_ASSET}" | tar -xz -C /usr/local/bin
          pun --version
      - name: Install PHP deps with Pun
        run: |
          pun install --working-dir=php/runtime
          pun install --working-dir=php/lintel
          pun install --working-dir=php/lintel-phpstan
          pun install --working-dir=php/markup
          pun install --working-dir=php/blade
          pun install --working-dir=php/twig
          pun install --working-dir=bench
      - name: Build the lintel binary
        run: cargo build --release -p lintel-cli
      - name: T-11 acceptance — fresh plain-PHP AND Laravel skeletons (composer require → edit → refresh, no watcher)
        run: bash scripts/dx-smoke.sh
        env:
          LINTEL_BIN: ${{ github.workspace }}/target/release/lintel

  starter:
    name: starter (M2 — the zero-Rust first-run path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.6'
          coverage: none
          tools: composer
      - uses: dtolnay/rust-toolchain@stable
      - name: "Install Pun"
        run: |
          curl -fsSL "https://github.com/${PUN_REPO}/releases/download/v${PUN_VERSION}/${PUN_ASSET}" | tar -xz -C /usr/local/bin
          pun --version
      - name: Install PHP deps with Pun
        run: |
          pun install --working-dir=php/runtime
          pun install --working-dir=php/lintel
          pun install --working-dir=php/lintel-phpstan
          pun install --working-dir=php/markup
          pun install --working-dir=php/blade
          pun install --working-dir=php/twig
          pun install --working-dir=bench
      - name: Build the lintel binary (the prebuilt binary the installer plugin caches)
        run: cargo build --release -p lintel-cli
      - name: M2 starter smoke — composer create-project → dev loader → prod build → HTTP serve (NO Rust toolchain at runtime)
        run: bash scripts/starter-smoke.sh
        env:
          LINTEL_BIN: ${{ github.workspace }}/target/release/lintel

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the lintel binary
        run: cargo build --release -p lintel-cli
      - name: "T-14 — the §9.2 harness on the Docker-pinned php:8.6 image (digest pin; no native fallback in CI)"
        run: make bench-docker
      - name: Commit-nothing guard — results land as job artifacts, not tree edits
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/results/

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen-cli (the version locked in Cargo.lock)
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: "T-13 size budget: bundle + page gzip under 1 MB"
        run: make size-budget
      - name: Rebuild the committed playground bundle
        run: make playground
      - uses: actions/upload-artifact@v4
        with:
          name: playground
          path: playground/

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: "T-17 docs site v0: build + link check (§13.7)"
        run: make docs-site
      - name: "M4 claims sweep — no stale pre-1.0 / v0.x maturity claims outside the allowlist"
        run: bash scripts/claims-sweep.sh
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs-site/build/

  editors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: "T-16 grammar: tokenize .lintel.php the way VS Code does"
        working-directory: editors/vscode
        run: |
          npm install --no-audit --no-fund
          npm test

  adapters-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          # ext-swoole (v6.3) does not yet support PHP 8.6 (requires
          # >=8.2 <8.6), so this lane pins 8.5 — the latest swoole-
          # compatible PHP. The main php job runs 8.6 and asserts the
          # ext is absent, so loading it there would break that lane.
          php-version: '8.5'
          coverage: none
          extensions: swoole
          tools: composer
      - name: composer install (the runtime package the lanes drive)
        # --ignore-platform-req=php: the lock requires >=8.6 but this lane
        # pins 8.5 for swoole compatibility; the runtime source is
        # PHP 8.6-target but swoole-independent, so 8.5 runs the lanes.
        run: composer install --working-dir=php/runtime --no-interaction --no-progress --ignore-platform-req=php
      - name: Assert the live lanes can run (the gates must be satisfiable, never silently skipped)
        run: |
          php -r "if (!extension_loaded('swoole')) { fwrite(STDERR, 'ext-swoole missing on the runner'); exit(1); } echo 'ext-swoole loaded: ', phpversion('swoole'), PHP_EOL;"
      - name: Download the real FrankenPHP binary (the Caddy-based runtime, static build)
        run: |
          curl -fsSL --retry 2 -o /tmp/frankenphp             https://github.com/php/frankenphp/releases/download/v1.14.0/frankenphp-linux-x86_64
          chmod +x /tmp/frankenphp
          /tmp/frankenphp version
          echo "/tmp" >> "$GITHUB_PATH"
      - name: The live adapter lanes (Swoole ext server + real FrankenPHP binary + the php -S FPM lane)
        run: php php/runtime/vendor/bin/phpunit --configuration php/runtime/phpunit.xml --filter AdapterTransportTest
        env:
          LINTEL_E2E_FRANKENPHP: '1'

  launch-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the lintel binary the tape drives
        run: cargo build --release -p lintel-cli
      - name: Put the binary on PATH for the tape
        run: echo "$PWD/target/release" >> "$GITHUB_PATH"
      - name: "T-19 launch GIF: render docs/demo.tape (edit → refresh → compiled view)"
        uses: charmbracelet/vhs-action@v2
        with:
          path: docs/demo.tape
      - uses: actions/upload-artifact@v4
        with:
          name: launch-gif
          path: docs/demo.gif

  install-smoke:
    name: install-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.6'
      - name: Build the release binary for this runner
        run: cargo build --release -p lintel-cli
      - name: Stage a local dist (archive + SHA256SUMS) the way release.yml does
        shell: bash
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) ARCHIVE=lintel-linux-x64.tar.gz ;;
            Darwin-arm64) ARCHIVE=lintel-macos-arm64.tar.gz ;;
            Darwin-x86_64) ARCHIVE=lintel-macos-x64.tar.gz ;;
            MINGW*) ARCHIVE=lintel-windows-x64.zip ;;
          esac
          mkdir -p dist
          if [ "${ARCHIVE##*.}" = zip ]; then
            cp target/release/lintel.exe dist/
            (cd dist && 7z a lintel-windows-x64.zip lintel.exe && rm lintel.exe)
          else
            cp target/release/lintel dist/
            (cd dist && tar -czf "$ARCHIVE" lintel && rm lintel)
          fi
          (cd dist && sha256sum lintel-* > SHA256SUMS)
      - name: "T-20: install + render a component inside the 10-minute budget"
        shell: bash
        env:
          LINTEL_RELEASE_ROOT: ${{ github.workspace }}/dist
          LINTEL_RUNTIME_PATH: ${{ github.workspace }}/php/runtime/src/functions.php
        run: bash scripts/walkthrough.sh

  windows-daemon:
    name: windows-daemon (the M3 TCP fallback lane)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: "M3 acceptance — the daemon's Windows TCP lane serves the T-12 contracts"
        # The watch suite's daemon tests are platform-neutral: on Windows
        # `Stream` binds a loopback TCP listener (the ephemeral port rides
        # `<socket-path>.port`), so the suite exercises serve+recompile-on-
        # change, the build-cache-backed rebuilds, the concurrent-clients
        # lane and the p50/p99-vs-spawn measurement over TCP. Serial: each
        # test tears down a scratch directory whose socket the next test's
        # daemon must not hold open (Windows directory locking is strict).
        run: cargo test -p lintel-cli --all-features --test watch -- --test-threads=1

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.6'
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: "M2 corpus seeding — the differential templates, the fallback edges and the §7.2 payloads"
        run: cargo test -p lintel-core --test fuzz_corpus
      - name: "T-09: the ten-minute fuzz acceptance on compile(), over the seeded corpus"
        run: cargo fuzz run compile_fuzz -- -max_total_time=600
        env:
          PHP_BIN: php

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.6'
          coverage: none
          tools: composer
      - name: "Install Pun"
        run: |
          curl -fsSL "https://github.com/${PUN_REPO}/releases/download/v${PUN_VERSION}/${PUN_ASSET}" | tar -xz -C /usr/local/bin
          pun --version
      - name: Install PHP deps with Pun
        run: |
          pun install --working-dir=
          pun install --working-dir=php/lintel --no-interaction --no-progress
          pun install --working-dir=php/lintel-phpstan --no-interaction --no-progress
          pun install --working-dir=php/markup --no-interaction --no-progress
          pun install --working-dir=php/blade --no-interaction --no-progress
          pun install --working-dir=php/twig --no-interaction --no-progress
          pun install --working-dir=bench --no-interaction --no-progress
      - name: Build the lintel binary
        run: cargo build --release -p lintel-cli
      - name: Install RoadRunner (the version docs/deployment/roadrunner.md pins)
        run: |
          curl -fsSL --retry 2 -o /tmp/rr.tar.gz \
            https://github.com/roadrunner-server/roadrunner/releases/download/v2025.1.15/roadrunner-2025.1.15-linux-amd64.tar.gz
          mkdir -p /tmp/rr-bin && tar -xzf /tmp/rr.tar.gz --strip-components=1 -C /tmp/rr-bin
          echo "/tmp/rr-bin" >> "$GITHUB_PATH"
      - name: "M4 deployment acceptance — the RoadRunner guide end-to-end (docs/deployment/roadrunner.md)"
        run: bash scripts/deployment-smoke.sh
        env:
          PHP_BIN: php
