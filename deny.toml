# cargo-deny policy (task-card T-01's CI gate; closes the carried drift).
# The workspace is intentionally dependency-light: two path dependencies and
# criterion for benches. The policy keeps it that way.

[graph]
all-features = true

[licenses]
version = 2
# The workspace is MIT OR Apache-2.0; the dev tooling (criterion + its
# transitive deps) stays inside this permissive set. Entries that were not
# encountered are listed once they appear — no speculative allowances.
allow = [
    "MIT",
    "Apache-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
# The intra-workspace path dependencies (lintel-core/lintel-diag/lintel-cli)
# are versionless by design; "deny" would reject the monorepo layout itself.
wildcards = "allow"
deny = []
skip = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[advisories]
version = 2
yanked = "warn"
ignore = []
