# cargo-deny policy (task-card T-01's CI gate; closes the carried drift).
# The workspace is intentionally dependency-light: two path dependencies and
# criterion for benches. The policy keeps it that way.

[graph]
all-features = true

[licenses]
version = 2
# The workspace is MIT OR Apache-2.0; the dev tooling (criterion + its
# transitive deps) stays inside this permissive set. Entries that were not
# encountered are listed once they appear — no speculative allowances.
allow = [
    "MIT",
    "Apache-2.0",
    # The wasm/docs dependency tree (wasm-bindgen, pulldown-cmark) pulls
    # unicode-ident, whose license expression gained the permissive
    # Unicode-3.0 grant for the Unicode data tables it embeds.
    "Unicode-3.0",
    # The T-12 `lintl watch` file-watcher dependency (notify 8.x) is
    # dedicated to the public domain under CC0-1.0 — FSF free/libre, the
    # same effective terms as the permissive set above.
    "CC0-1.0",
    # notify's Linux backend (inotify, inotify-sys) is classic ISC —
    # OSI-approved and FSF free/libre, BSD-family permissive.
    "ISC",
    # The tree-sitter lane's build chain (foldhash, a serde_json/hashbrown
    # transitive) is classic Zlib — OSI-approved and FSF free/libre, the
    # same permissive family as the entries above.
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
# The intra-workspace path dependencies (lintl-core/lintl-diag/lintl-cli)
# are versionless by design; "deny" would reject the monorepo layout itself.
wildcards = "allow"
deny = []
skip = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[advisories]
version = 2
yanked = "warn"
ignore = []
